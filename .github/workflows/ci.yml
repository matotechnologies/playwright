name: CI Pipeline - Playwright Tests (Python & JS)

on:
  push:
    paths:
      - 'python-tests/**'
      - 'JS-tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'python-tests/**'
      - 'JS-tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      has_python: ${{ steps.detect.outputs.has_python }}
      python_task_dir: ${{ steps.detect.outputs.python_task_dir }}
      python_member: ${{ steps.detect.outputs.python_member }}
      python_task_name: ${{ steps.detect.outputs.python_task_name }}
      has_js: ${{ steps.detect.outputs.has_js }}
      js_task_dir: ${{ steps.detect.outputs.js_task_dir }}
      js_member: ${{ steps.detect.outputs.js_member }}
      js_task_name: ${{ steps.detect.outputs.js_task_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed task directories & languages
        id: detect
        run: |
          # Differentiate between a direct push to main and branch/PR changes
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ github.event_name }}" = "push" ]; then
            DIFF_BASE="HEAD~1 HEAD"
          else
            DIFF_BASE="origin/main...HEAD"
          fi

          echo "Diffing base: $DIFF_BASE"

          # Detect Python changes (ignores .gitkeep, requires 3-level folder structure)
          PY_TASK=$(git diff --name-only $DIFF_BASE | grep -iE '^python-tests/[^/]+/[^/]+' | grep -v '\.gitkeep' | cut -d'/' -f1-3 | sort -u | head -n 1)
          if [ -n "$PY_TASK" ] && [ -d "$PY_TASK" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "python_task_dir=$PY_TASK" >> $GITHUB_OUTPUT
            echo "python_member=$(echo "$PY_TASK" | cut -d'/' -f2)" >> $GITHUB_OUTPUT
            echo "python_task_name=$(echo "$PY_TASK" | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "Found Python task: $PY_TASK"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

          # Detect JavaScript changes (ignores .gitkeep, requires 3-level folder structure)
          JS_TASK=$(git diff --name-only $DIFF_BASE | grep -iE '^js-tests/[^/]+/[^/]+' | grep -v '\.gitkeep' | cut -d'/' -f1-3 | sort -u | head -n 1)
          if [ -n "$JS_TASK" ] && [ -d "$JS_TASK" ]; then
            echo "has_js=true" >> $GITHUB_OUTPUT
            echo "js_task_dir=$JS_TASK" >> $GITHUB_OUTPUT
            echo "js_member=$(echo "$JS_TASK" | cut -d'/' -f2)" >> $GITHUB_OUTPUT
            echo "js_task_name=$(echo "$JS_TASK" | cut -d'/' -f3)" >> $GITHUB_OUTPUT
            echo "Found JS task: $JS_TASK"
          else
            echo "has_js=false" >> $GITHUB_OUTPUT
          fi

          # Global changes indicator
          if [ -d "$PY_TASK" ] || [ -d "$JS_TASK" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No valid task directory changes detected."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # ------------------- PYTHON ENVIRONMENT -------------------
      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        run: |
          cd ${{ steps.detect.outputs.python_task_dir }}
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ------------------- JAVASCRIPT ENVIRONMENT -------------------
      - name: Set up Node.js
        if: steps.detect.outputs.has_js == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        if: steps.detect.outputs.has_js == 'true'
        run: |
          cd ${{ steps.detect.outputs.js_task_dir }}
          npm ci || npm install
          npx playwright install --with-deps chromium

      # ------------------- START TOOLSHOP APP -------------------
      - name: Start Toolshop App
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git clone https://github.com/testsmith-io/practice-software-testing.git
          cd practice-software-testing
          docker compose up -d

          echo "Waiting for MariaDB and executing database seeding..."
          for i in {1..12}; do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed; then
              echo "Database seeded successfully."
              break
            fi
            echo "Database not ready yet, retrying in 5s... ($i/12)"
            sleep 5
          done

          docker compose exec -T --user root laravel-api chmod -R 777 storage bootstrap/cache .env

      - name: Wait for Toolshop Readiness (ports 8091 & 4200)
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Waiting for Toolshop API (port 8091)..."
          for i in {1..30}; do
            if curl -s http://localhost:8091/products | grep -q "id"; then
              echo "Toolshop API is ready."
              break
            fi
            sleep 5
          done

          echo "Waiting for Toolshop Frontend (port 4200)..."
          FRONTEND_READY=false
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Toolshop Frontend is ready (HTTP 200)."
              FRONTEND_READY=true
              break
            fi
            sleep 5
          done

          if [ "$FRONTEND_READY" = false ]; then
            echo "Toolshop Frontend failed to start. Container logs:"
            cd practice-software-testing
            docker compose logs --tail=100
            exit 1
          fi

      # ------------------- START ORANGEHRM -------------------
      - name: Start OrangeHRM
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          docker network create orangehrm-net || true

          docker run -d --name orangehrm-db \
            --network orangehrm-net \
            --restart unless-stopped \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            -e MYSQL_DATABASE=orangehrm \
            -e MYSQL_USER=orangehrm \
            -e MYSQL_PASSWORD=orangehrmpass \
            mariadb:10.5

          echo "Waiting 15s for OrangeHRM database to start..."
          sleep 15

          docker run -d --name orangehrm-app \
            --network orangehrm-net \
            --restart unless-stopped \
            -p 4201:80 \
            -e ORANGEHRM_DATABASE_HOST=orangehrm-db \
            -e ORANGEHRM_DATABASE_NAME=orangehrm \
            -e ORANGEHRM_DATABASE_USER=orangehrm \
            -e ORANGEHRM_DATABASE_PASSWORD=orangehrmpass \
            orangehrm/orangehrm:latest

      - name: Wait for OrangeHRM Readiness (port 4201)
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "Waiting for OrangeHRM (port 4201)..."
          ORANGE_READY=false
          for i in {1..40}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4201 || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              echo "OrangeHRM is ready (HTTP $STATUS)."
              ORANGE_READY=true
              break
            fi
            sleep 5
          done

          if [ "$ORANGE_READY" = false ]; then
            echo "OrangeHRM failed to boot. Container logs:"
            docker logs --tail=100 orangehrm-app
            docker logs --tail=50 orangehrm-db
            exit 1
          fi

      # ------------------- TEST EXECUTION -------------------
      - name: Run Python Tests
        if: steps.detect.outputs.has_python == 'true'
        run: |
          cd ${{ steps.detect.outputs.python_task_dir }}
          pytest test.py --html=report.html --self-contained-html -v

      - name: Run JavaScript Tests
        if: steps.detect.outputs.has_js == 'true'
        run: |
          cd ${{ steps.detect.outputs.js_task_dir }}
          npx playwright test

      # ------------------- ARTIFACTS -------------------
      - name: Upload Test Reports
        if: always() && steps.detect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task-test-reports
          path: |
            ${{ steps.detect.outputs.python_task_dir }}/report.html
            ${{ steps.detect.outputs.python_task_dir }}/failure_*.png
            ${{ steps.detect.outputs.js_task_dir }}/playwright-report/
            ${{ steps.detect.outputs.js_task_dir }}/failure-*.png
          if-no-files-found: ignore

  # ------------------- DOCKER HUB DEPLOYMENT -------------------
  docker-push:
    needs: test
    if: success() && needs.test.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Python Task Image
        if: needs.test.outputs.has_python == 'true'
        run: |
          TASK_DIR="${{ needs.test.outputs.python_task_dir }}"
          MEMBER="${{ needs.test.outputs.python_member }}"
          TASK_NAME="${{ needs.test.outputs.python_task_name }}"

          if [ -f "$TASK_DIR/Dockerfile" ]; then
            # Dynamic destination repository routing
            if echo "$TASK_DIR" | grep -qi "orange" || grep -rqiE "(orangehrm|4201)" "$TASK_DIR"; then
              REPO_NAME="orangehrm-tests"
            else
              REPO_NAME="toolshop-tests"
            fi

            # Tag format: <dockerhub-user>/<repo>:<member>-<jira-task>-python
            IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/${REPO_NAME}:${MEMBER}-${TASK_NAME}-python"
            
            echo "Selected repository: $REPO_NAME"
            echo "Building image: $IMAGE_TAG from $TASK_DIR"
            docker build -t "$IMAGE_TAG" "$TASK_DIR"
            
            echo "Pushing image: $IMAGE_TAG"
            docker push "$IMAGE_TAG"
          else
            echo "No Dockerfile found in $TASK_DIR, skipping Python image build."
          fi

      - name: Build and Push JS Task Image
        if: needs.test.outputs.has_js == 'true'
        run: |
          TASK_DIR="${{ needs.test.outputs.js_task_dir }}"
          MEMBER="${{ needs.test.outputs.js_member }}"
          TASK_NAME="${{ needs.test.outputs.js_task_name }}"

          if [ -f "$TASK_DIR/Dockerfile" ]; then
            # Dynamic destination repository routing
            if echo "$TASK_DIR" | grep -qi "orange" || grep -rqiE "(orangehrm|4201)" "$TASK_DIR"; then
              REPO_NAME="orangehrm-tests"
            else
              REPO_NAME="toolshop-tests"
            fi

            # Tag format: <dockerhub-user>/<repo>:<member>-<jira-task>-js
            IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/${REPO_NAME}:${MEMBER}-${TASK_NAME}-js"
            
            echo "Selected repository: $REPO_NAME"
            echo "Building image: $IMAGE_TAG from $TASK_DIR"
            docker build -t "$IMAGE_TAG" "$TASK_DIR"
            
            echo "Pushing image: $IMAGE_TAG"
            docker push "$IMAGE_TAG"
          else
            echo "No Dockerfile found in $TASK_DIR, skipping JS image build."
          fi
