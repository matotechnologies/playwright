name: CI Pipeline - Playwright Tests (Python & JS)

on:
  push:
    paths:
      - 'python-tests/**'
      - 'JS-tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'python-tests/**'
      - 'JS-tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}

      has_python: ${{ steps.detect.outputs.has_python }}
      python_task_dir: ${{ steps.detect.outputs.python_task_dir }}
      python_member: ${{ steps.detect.outputs.python_member }}
      python_task_name: ${{ steps.detect.outputs.python_task_name }}

      has_js: ${{ steps.detect.outputs.has_js }}
      js_task_dir: ${{ steps.detect.outputs.js_task_dir }}
      js_member: ${{ steps.detect.outputs.js_member }}
      js_task_name: ${{ steps.detect.outputs.js_task_name }}

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DETECT CHANGED TASK
      # ============================================================

      - name: Detect changed task directories & languages
        id: detect
        shell: bash
        run: |
          set -e

          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ github.event_name }}" = "push" ]; then
            DIFF_BASE="HEAD~1 HEAD"
          else
            git fetch origin main --quiet
            DIFF_BASE="origin/main...HEAD"
          fi

          echo "Diffing base: $DIFF_BASE"

          # -----------------------------
          # Python task
          # -----------------------------

          PY_TASK=$(
            git diff --name-only $DIFF_BASE |
            grep -iE '^python-tests/[^/]+/[^/]+' |
            grep -v '\.gitkeep$' |
            cut -d'/' -f1-3 |
            sort -u |
            head -n 1 || true
          )

          if [ -n "$PY_TASK" ] && [ -d "$PY_TASK" ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
            echo "python_task_dir=$PY_TASK" >> "$GITHUB_OUTPUT"
            echo "python_member=$(echo "$PY_TASK" | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"
            echo "python_task_name=$(echo "$PY_TASK" | cut -d'/' -f3)" >> "$GITHUB_OUTPUT"

            echo "Found Python task: $PY_TASK"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "python_task_dir=" >> "$GITHUB_OUTPUT"
            echo "python_member=" >> "$GITHUB_OUTPUT"
            echo "python_task_name=" >> "$GITHUB_OUTPUT"

            echo "No Python task detected."
          fi

          # -----------------------------
          # JavaScript task
          # Supports JS-tests
          # -----------------------------

          JS_TASK=$(
            git diff --name-only $DIFF_BASE |
            grep -iE '^JS-tests/[^/]+/[^/]+' |
            grep -v '\.gitkeep$' |
            cut -d'/' -f1-3 |
            sort -u |
            head -n 1 || true
          )

          if [ -n "$JS_TASK" ] && [ -d "$JS_TASK" ]; then
            echo "has_js=true" >> "$GITHUB_OUTPUT"
            echo "js_task_dir=$JS_TASK" >> "$GITHUB_OUTPUT"
            echo "js_member=$(echo "$JS_TASK" | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"
            echo "js_task_name=$(echo "$JS_TASK" | cut -d'/' -f3)" >> "$GITHUB_OUTPUT"

            echo "Found JavaScript task: $JS_TASK"
          else
            echo "has_js=false" >> "$GITHUB_OUTPUT"
            echo "js_task_dir=" >> "$GITHUB_OUTPUT"
            echo "js_member=" >> "$GITHUB_OUTPUT"
            echo "js_task_name=" >> "$GITHUB_OUTPUT"

            echo "No JavaScript task detected."
          fi

          # -----------------------------
          # Overall changes
          # -----------------------------

          if [ -n "$PY_TASK" ] || [ -n "$JS_TASK" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Valid Playwright task changes detected."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No valid Playwright task changes detected."
          fi

      # ============================================================
      # PYTHON ENVIRONMENT
      # ============================================================

      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          set -e

          cd "${{ steps.detect.outputs.python_task_dir }}"

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest pytest-html pytest-playwright

          playwright install --with-deps chromium

      # ============================================================
      # JAVASCRIPT ENVIRONMENT
      # ============================================================

      - name: Set up Node.js
        if: steps.detect.outputs.has_js == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.detect.outputs.js_task_dir }}/package-lock.json

      - name: Install JS dependencies
        if: steps.detect.outputs.has_js == 'true'
        shell: bash
        run: |
          set -e

          cd "${{ steps.detect.outputs.js_task_dir }}"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npx playwright install --with-deps chromium

      # ============================================================
      # START TOOLSHOP
      # ============================================================

      - name: Start Toolshop App
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -e

          git clone https://github.com/testsmith-io/practice-software-testing.git

          cd practice-software-testing

          docker compose up -d

          echo "Waiting for Toolshop database..."

          for i in {1..30}; do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed; then
              echo "Toolshop database seeded successfully."
              break
            fi

            echo "Database not ready. Retry $i/30..."
            sleep 5
          done

          docker compose exec -T --user root laravel-api \
            chmod -R 777 storage bootstrap/cache .env || true

      # ============================================================
      # WAIT FOR TOOLSHOP
      # ============================================================

      - name: Wait for Toolshop Readiness
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -e

          echo "Waiting for Toolshop API on port 8091..."

          API_READY=false

          for i in {1..30}; do
            if curl -fsS http://localhost:8091/products | grep -q "id"; then
              echo "Toolshop API is ready."
              API_READY=true
              break
            fi

            echo "Waiting for API... $i/30"
            sleep 5
          done

          if [ "$API_READY" = false ]; then
            echo "Toolshop API failed to start."

            cd practice-software-testing
            docker compose logs --tail=100

            exit 1
          fi

          echo "Waiting for Toolshop Frontend on port 4200..."

          FRONTEND_READY=false

          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:4200 || true)

            if [ "$STATUS" = "200" ]; then
              echo "Toolshop Frontend is ready."
              FRONTEND_READY=true
              break
            fi

            echo "Waiting for frontend... $i/30"
            sleep 5
          done

          if [ "$FRONTEND_READY" = false ]; then
            echo "Toolshop frontend failed to start."

            cd practice-software-testing
            docker compose logs --tail=100

            exit 1
          fi

      # ============================================================
      # START ORANGEHRM
      # ============================================================

      - name: Start OrangeHRM
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -e

          echo "Creating OrangeHRM Docker network..."

          docker network create orangehrm-net || true

          # --------------------------------------------------------
          # Validate required files
          # --------------------------------------------------------

          if [ ! -s ".ci/orangehrm_seed.sql" ]; then
            echo "::error::.ci/orangehrm_seed.sql is missing or empty."
            exit 1
          fi

          if [ ! -s ".ci/Conf.php" ]; then
            echo "::error::.ci/Conf.php is missing or empty."
            exit 1
          fi

          echo "OrangeHRM seed file found."
          echo "OrangeHRM configuration found."

          # --------------------------------------------------------
          # Remove old containers if they exist
          # --------------------------------------------------------

          docker rm -f orangehrm-app 2>/dev/null || true
          docker rm -f orangehrm-db 2>/dev/null || true

          # --------------------------------------------------------
          # Start MySQL
          # --------------------------------------------------------

          echo "Starting MySQL 8.0..."

          docker run -d \
            --name orangehrm-db \
            --network orangehrm-net \
            -v "${{ github.workspace }}/.ci/orangehrm_seed.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            -e MYSQL_DATABASE=orangehrm \
            -e MYSQL_USER=orangehrm \
            -e MYSQL_PASSWORD=orangehrmpass \
            mysql:8.0 \
            --default-authentication-plugin=mysql_native_password

          # --------------------------------------------------------
          # Wait for MySQL
          # --------------------------------------------------------

          echo "Waiting for MySQL initialization..."

          MYSQL_READY=false

          for i in {1..60}; do

            if docker exec orangehrm-db \
              mysqladmin ping \
              -h localhost \
              -uroot \
              -prootpass \
              --silent; then

              echo "MySQL is accepting connections."

              if docker exec orangehrm-db \
                mysql \
                -uroot \
                -prootpass \
                -e "USE orangehrm; SHOW TABLES;" >/tmp/orangehrm_tables.txt 2>/dev/null; then

                TABLE_COUNT=$(docker exec orangehrm-db \
                  mysql \
                  -uroot \
                  -prootpass \
                  -N \
                  -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='orangehrm';")

                echo "OrangeHRM table count: $TABLE_COUNT"

                if [ "$TABLE_COUNT" -gt 0 ]; then
                  MYSQL_READY=true
                  echo "OrangeHRM database initialization completed."
                  break
                fi
              fi
            fi

            echo "Waiting for MySQL/database initialization... $i/60"
            sleep 3
          done

          if [ "$MYSQL_READY" = false ]; then
            echo "::error::OrangeHRM MySQL database did not initialize correctly."

            echo "MySQL container logs:"
            docker logs --tail=200 orangehrm-db

            exit 1
          fi

          # --------------------------------------------------------
          # Verify important OrangeHRM data
          # --------------------------------------------------------

          echo "Checking OrangeHRM job titles..."

          JOB_TITLE_COUNT=$(docker exec orangehrm-db \
            mysql \
            -uorangehrm \
            -porangehrmpass \
            -N \
            -e "SELECT COUNT(*) FROM orangehrm.ohrm_job_title;" \
            2>/dev/null || echo "0")

          echo "Job title count: $JOB_TITLE_COUNT"

          echo "Checking OrangeHRM employees..."

          EMPLOYEE_COUNT=$(docker exec orangehrm-db \
            mysql \
            -uorangehrm \
            -porangehrmpass \
            -N \
            -e "SELECT COUNT(*) FROM orangehrm.hs_hr_employee;" \
            2>/dev/null || echo "0")

          echo "Employee count: $EMPLOYEE_COUNT"

          echo "Checking OrangeHRM users..."

          USER_COUNT=$(docker exec orangehrm-db \
            mysql \
            -uorangehrm \
            -porangehrmpass \
            -N \
            -e "SELECT COUNT(*) FROM orangehrm.ohrm_user;" \
            2>/dev/null || echo "0")

          echo "User count: $USER_COUNT"

          # --------------------------------------------------------
          # Start OrangeHRM application
          # --------------------------------------------------------

          echo "Starting OrangeHRM application..."

          docker run -d \
            --name orangehrm-app \
            --network orangehrm-net \
            -p 4201:80 \
            -v "${{ github.workspace }}/.ci/Conf.php:/var/www/html/lib/confs/Conf.php:ro" \
            orangehrm/orangehrm:latest

          echo "OrangeHRM application started."

      # ============================================================
      # WAIT FOR ORANGEHRM
      # ============================================================

      - name: Wait for OrangeHRM Readiness
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -e

          echo "Waiting for OrangeHRM login page..."

          ORANGE_READY=false

          for i in {1..60}; do

            STATUS=$(curl -s -L \
              -o /tmp/orangehrm_login.html \
              -w "%{http_code}" \
              http://localhost:4201/web/index.php/auth/login || true)

            if [ "$STATUS" = "200" ]; then
              echo "OrangeHRM login page is ready."

              ORANGE_READY=true
              break
            fi

            echo "OrangeHRM is starting... attempt $i/60 (HTTP $STATUS)"

            sleep 5
          done

          if [ "$ORANGE_READY" = false ]; then

            echo "::error::OrangeHRM failed to start."

            echo "----------------------------------------"
            echo "OrangeHRM application logs"
            echo "----------------------------------------"

            docker logs --tail=200 orangehrm-app || true

            echo "----------------------------------------"
            echo "MySQL logs"
            echo "----------------------------------------"

            docker logs --tail=200 orangehrm-db || true

            echo "----------------------------------------"
            echo "Apache error log"
            echo "----------------------------------------"

            docker exec orangehrm-app \
              cat /var/log/apache2/error.log \
              2>/dev/null || true

            exit 1
          fi

          echo "OrangeHRM is ready on http://localhost:4201"

      # ============================================================
      # VERIFY ORANGEHRM DATABASE
      # ============================================================

      - name: Verify OrangeHRM Test Data
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "========================================"
          echo "OrangeHRM Database Verification"
          echo "========================================"

          echo "Employees:"
          docker exec orangehrm-db \
            mysql \
            -uorangehrm \
            -porangehrmpass \
            -e "
              SELECT emp_number,
                     employee_id,
                     emp_firstname,
                     emp_lastname
              FROM orangehrm.hs_hr_employee;
            " || true

          echo "Job Titles:"
          docker exec orangehrm-db \
            mysql \
            -uorangehrm \
            -porangehrmpass \
            -e "
              SELECT id,
                     job_title
              FROM orangehrm.ohrm_job_title;
            " || true

          echo "Employment Status:"
          docker exec orangehrm-db \
            mysql \
            -uorangehrm \
            -porangehrmpass \
            -e "
              SELECT id,
                     name
              FROM orangehrm_ohrm_employment_status;
            " 2>/dev/null || true

      # ============================================================
      # RUN PYTHON TESTS
      # ============================================================

      - name: Run Python Tests
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          set -e

          cd "${{ steps.detect.outputs.python_task_dir }}"

          echo "Running Python Playwright tests..."

          pytest test.py \
            --html=report.html \
            --self-contained-html \
            -v

      # ============================================================
      # RUN JAVASCRIPT TESTS
      # ============================================================

      - name: Run JavaScript Tests
        if: steps.detect.outputs.has_js == 'true'
        shell: bash
        run: |
          set -e

          cd "${{ steps.detect.outputs.js_task_dir }}"

          echo "Running JavaScript Playwright tests..."

          npx playwright test

      # ============================================================
      # UPLOAD TEST REPORTS
      # ============================================================

      - name: Upload Test Reports
        if: always() && steps.detect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: task-test-reports
          path: |
            ${{ steps.detect.outputs.python_task_dir }}/report.html
            ${{ steps.detect.outputs.python_task_dir }}/failure_*.png
            ${{ steps.detect.outputs.python_task_dir }}/test-results/
            ${{ steps.detect.outputs.js_task_dir }}/playwright-report/
            ${{ steps.detect.outputs.js_task_dir }}/test-results/
            ${{ steps.detect.outputs.js_task_dir }}/failure-*.png
          if-no-files-found: ignore

      # ============================================================
      # DEBUG CONTAINERS IF TEST FAILS
      # ============================================================

      - name: OrangeHRM Debug Logs
        if: failure() && steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "========================================"
          echo "OrangeHRM APP LOGS"
          echo "========================================"

          docker logs --tail=200 orangehrm-app 2>/dev/null || true

          echo "========================================"
          echo "ORANGEHRM MYSQL LOGS"
          echo "========================================"

          docker logs --tail=200 orangehrm-db 2>/dev/null || true

          echo "========================================"
          echo "RUNNING CONTAINERS"
          echo "========================================"

          docker ps -a

  # ================================================================
  # DOCKER HUB DEPLOYMENT
  # ================================================================

  docker-push:
    needs: test

    if: success() && needs.test.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DOCKER LOGIN
      # ============================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ============================================================
      # PYTHON DOCKER IMAGE
      # ============================================================

      - name: Build and Push Python Task Image
        if: needs.test.outputs.has_python == 'true'
        shell: bash
        run: |
          set -e

          TASK_DIR="${{ needs.test.outputs.python_task_dir }}"
          MEMBER="${{ needs.test.outputs.python_member }}"
          TASK_NAME="${{ needs.test.outputs.python_task_name }}"

          echo "Python task directory: $TASK_DIR"
          echo "Member: $MEMBER"
          echo "Task: $TASK_NAME"

          if [ -f "$TASK_DIR/Dockerfile" ]; then

            if echo "$TASK_DIR" | grep -qi "orange" || \
               grep -rqiE "(orangehrm|4201)" "$TASK_DIR"; then

              REPO_NAME="orangehrm-tests"

            else

              REPO_NAME="toolshop-tests"

            fi

            IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/${REPO_NAME}:${MEMBER}-${TASK_NAME}-python"

            echo "Repository: $REPO_NAME"
            echo "Image: $IMAGE_TAG"

            docker build \
              -t "$IMAGE_TAG" \
              "$TASK_DIR"

            docker push "$IMAGE_TAG"

            echo "Python image pushed successfully."

          else

            echo "No Dockerfile found in $TASK_DIR."
            echo "Skipping Python image build."

          fi

      # ============================================================
      # JAVASCRIPT DOCKER IMAGE
      # ============================================================

      - name: Build and Push JS Task Image
        if: needs.test.outputs.has_js == 'true'
        shell: bash
        run: |
          set -e

          TASK_DIR="${{ needs.test.outputs.js_task_dir }}"
          MEMBER="${{ needs.test.outputs.js_member }}"
          TASK_NAME="${{ needs.test.outputs.js_task_name }}"

          echo "JavaScript task directory: $TASK_DIR"
          echo "Member: $MEMBER"
          echo "Task: $TASK_NAME"

          if [ -f "$TASK_DIR/Dockerfile" ]; then

            if echo "$TASK_DIR" | grep -qi "orange" || \
               grep -rqiE "(orangehrm|4201)" "$TASK_DIR"; then

              REPO_NAME="orangehrm-tests"

            else

              REPO_NAME="toolshop-tests"

            fi

            IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/${REPO_NAME}:${MEMBER}-${TASK_NAME}-js"

            echo "Repository: $REPO_NAME"
            echo "Image: $IMAGE_TAG"

            docker build \
              -t "$IMAGE_TAG" \
              "$TASK_DIR"

            docker push "$IMAGE_TAG"

            echo "JavaScript image pushed successfully."

          else

            echo "No Dockerfile found in $TASK_DIR."
            echo "Skipping JavaScript image build."

          fi
